# GREEN ARMOR Academy — fully private, container-only AD training network.
# No ports are published on the host; never attach this deliberately weak DC to production networks.
name: green-armor-directory-range
services:
  dc:
    build: ./docker/dc
    hostname: dc01
    restart: unless-stopped
    mem_limit: 1g
    pids_limit: 256
    volumes:
      - ad_etc:/etc/samba
      - ad_data:/var/lib/samba
      - ad_files:/srv/armor
      - ./runtime/seed/scenario.json:/run/armor/scenario.json:ro
    networks:
      training:
        aliases:
          - dc
          - dc01.armor.test
          - armor.test
    healthcheck:
      test: ["CMD", "sh", "-c", "nc -z 127.0.0.1 445"]
      interval: 10s
      timeout: 3s
      retries: 18
      start_period: 45s
    security_opt:
      - no-new-privileges:true
  student:
    build: ./docker/student
    hostname: student
    stdin_open: true
    tty: true
    command: ["sleep", "infinity"]
    mem_limit: 512m
    pids_limit: 128
    depends_on:
      dc:
        condition: service_healthy
    networks:
      - training
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
networks:
  training:
    internal: true
    driver: bridge
volumes:
  ad_etc:
  ad_data:
  ad_files:
